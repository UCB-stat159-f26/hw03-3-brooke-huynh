[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tennisplayermatches"
version = "0.1.0"
description = "A package to retrieve and visualize tennis career matches of a given player from Tennis Abstract."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pandas",
    "requests",
    "matplotlib",
	"seaborn"
]

[tool.setuptools.packages.find]
where = ["src"]